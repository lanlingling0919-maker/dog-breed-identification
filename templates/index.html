<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>AI 智能犬种识别系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="top-nav"><div class="nav-content"><div class="logo">🐾 AI Dog Breed Identifier</div><div class="menu"><span onclick="goPage('home')">首页</span><span onclick="goPage('history')">识别历史</span><span id="admin-nav" onclick="goPage('admin')" style="display:none; color:#ffd700;">🛡️ 管理后台</span><button id="auth-btn" onclick="openAuthModal()">登录/注册</button></div></div></nav>
    
    <!-- 首页 -->
    <main id="home-view" class="container"><header class="page-title"><h1>🐕 智能犬种识别系统</h1><p>由深度神经网络为您精准识别</p></header><div class="grid-layout"><div class="card"><div class="card-header">🖼️ 照片上传预览</div><div class="drop-zone" onclick="clickUpload()"><input type="file" id="file-input" hidden onchange="previewImg(this)"><div id="upload-hint">📤 点击上传狗狗照片</div><img id="img-preview" style="display:none;"></div></div><div class="card"><div class="card-header">⚙️ 智能分析引擎</div><button class="btn-primary" onclick="startIdentify()">开始智能识别分析</button><div id="result-box" style="display:none; flex:1; display:flex; flex-direction:column;"><div class="res-summary"><div class="res-item"><p class="label">结论</p><p class="val-big" id="res-cn">--</p><p class="val-sub" id="res-en">--</p></div><div class="res-item"><p class="label">置信度</p><p class="val-big" id="res-conf">0%</p></div></div><div class="wiki-box"><p style="font-weight:800; margin-bottom:10px; color:#e69138;">📖 犬种百科：</p><div id="wiki-text"></div></div></div><button id="apply-btn" onclick="applyAdmin()" class="btn-minor" style="display:none; margin-top:20px;">申请管理员</button></div></div></main>

    <!-- 历史 -->
    <main id="history-view" class="container" style="display:none;"><div class="card"><h1>📜 识别档案</h1><div id="history-grid" class="history-grid"></div></div></main>

    <!-- 管理中心 -->
    <main id="admin-view" class="container" style="display:none;"><div class="admin-grid"><div class="card"><h3>📊 系统运行指标</h3><div class="stats-row"><div class="stat-item"><p>总用户</p><b id="stat-users">0</b></div><div class="stat-item"><p>总识别</p><b id="stat-imgs">0</b></div></div></div><div class="card"><h3>🛡️ 待审批申请</h3><div id="pending-list"></div></div><div class="card full-width"><h3>🕵️ 全站行为审计（含照片）</h3><div id="admin-logs" class="admin-table"></div></div></div></main>

    <div id="auth-modal" class="modal-overlay"><div class="modal-card"><h2>身份验证</h2><input type="text" id="user-in" placeholder="用户名" class="ipt"><input type="password" id="pass-in" placeholder="密码" class="ipt"><button class="btn-primary" onclick="doAuth()">确 认</button><p onclick="switchAuthMode()" style="color:#e69138; cursor:pointer; margin-top:15px;">切换注册</p><button onclick="closeAuthModal()" style="background:none; border:none; color:#999; margin-top:10px; cursor:pointer;">取消</button></div></div>
    <script src="/static/js/main.js"></script>
</body>
</html>
