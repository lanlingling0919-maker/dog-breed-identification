<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 智能犬种识别系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 【修改】使用 url_for 引用静态资源 -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 text-center">
                <h1 class="display-4 mb-4">🐕 智能犬种识别系统</h1>
                
                <div class="card shadow-sm mb-4">
                    <div class="card-body py-5">
                        <div class="upload-area mb-3" id="drop-area">
                            <input type="file" id="file-input" hidden accept="image/*">
                            <label for="file-input" class="btn btn-primary btn-lg">选择狗狗照片</label>
                            <p class="text-muted mt-2">支持 JPG, PNG 格式</p>
                        </div>
                        <div id="preview-container" class="mb-3" style="display: none;">
                            <img id="image-preview" class="img-fluid rounded shadow" style="max-height: 300px;">
                        </div>
                        <button id="predict-btn" class="btn btn-success btn-lg w-100" disabled>开始识别</button>
                    </div>
                </div>

                <div id="result-area" class="card shadow-sm" style="display: none;">
                    <div class="card-body">
                        <h3 class="text-success mb-3">识别成功！</h3>
                        <div class="row">
                            <div class="col-6 text-end fw-bold">品种 (中文)：</div>
                            <div class="col-6 text-start" id="res-cn">---</div>
                        </div>
                        <div class="row">
                            <div class="col-6 text-end fw-bold">品种 (英文)：</div>
                            <div class="col-6 text-start" id="res-en">---</div>
                        </div>
                        <div class="row mt-2">
                            <div class="col-6 text-end fw-bold">可信度：</div>
                            <div class="col-6 text-start">
                                <span class="badge bg-warning text-dark" id="res-conf">0%</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="loader" class="mt-4" style="display: none;">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="mt-2">正在分析狗狗特征，请稍候...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 【修改】使用 url_for 引用 JS -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
