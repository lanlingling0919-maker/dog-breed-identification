<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐕 AI 智能犬种识别系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&family=Quicksand:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.staticfile.org/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="app-dashboard">
        <header class="deep-orange-header shadow">
            <div class="container-fluid px-4 h-100 d-flex align-items-center">
                <span class="header-logo"><i class="fas fa-paw me-2"></i>AI Dog Breed Identifier</span>
            </div>
        </header>

        <div class="main-stage container-fluid px-4 py-2">
            <!-- 标题区：大幅压缩间距 -->
            <div class="title-section text-center mb-2 animate-fade">
                <h2 class="main-headline mb-0">🐕 智能犬种识别系统</h2>
                <p class="text-secondary small subtitle">上传狗狗照片，为您精准识别品种</p>
            </div>

            <div class="row gx-4">
                <!-- 左侧：照片选择 -->
                <div class="col-lg-5">
                    <div class="warm-card shadow-sm">
                        <div class="card-label"><i class="fas fa-image me-2"></i>照片上传预览</div>
                        <div class="card-body p-3">
                            <!-- 压缩后的上传框 -->
                            <div class="upload-box-warm" id="drop-area">
                                <input type="file" id="file-input" hidden accept="image/*">
                                <div class="upload-content">
                                    <i class="fas fa-cloud-arrow-up fa-2x text-orange mb-1"></i>
                                    <p class="fw-bold mb-2">拖拽或点击</p>
                                    <label for="file-input" class="btn btn-orange-pill btn-sm">选择狗狗照片</label>
                                </div>
                            </div>
                            
                            <!-- 狗狗图片展示区：重点优化，确保能看见 -->
                            <div id="preview-container" class="preview-stage mt-2 animate-pop" style="display: none;">
                                <img id="image-preview" class="img-fluid rounded shadow-sm">
                            </div>
                            <div id="placeholder-box" class="placeholder-stage mt-2">
                                <i class="fas fa-dog fa-3x text-orange-light mb-2"></i>
                                <p class="text-muted small">预览区域</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 右侧：分析识别 -->
                <div class="col-lg-7">
                    <div class="warm-card shadow-sm">
                        <div class="card-label"><i class="fas fa-microchip me-2"></i>智能分析结果</div>
                        <div class="card-body p-3">
                            <button id="predict-btn" class="btn btn-predict-deep w-100 py-2 mb-3 shadow-sm" disabled>
                                <i class="fas fa-wand-magic-sparkles me-2"></i>开始智能识别分析
                            </button>
                            
                            <div class="results-container">
                                <div id="loader" class="text-center py-4" style="display: none;">
                                    <i class="fas fa-dog fa-bounce fa-2x text-orange mb-2"></i>
                                    <p class="text-orange fw-bold">分析中...</p>
                                </div>
                                
                                <div id="result-area" class="result-dashboard animate-pop" style="display: none;">
                                    <div class="row g-0 align-items-center">
                                        <div class="col-md-7 text-center border-end">
                                            <span class="badge bg-orange-soft text-orange mb-1">识别结论</span>
                                            <h1 id="res-cn" class="display-5 fw-bold text-dark mb-0">---</h1>
                                            <p id="res-en" class="text-muted fst-italic small">---</p>
                                        </div>
                                        <div class="col-md-5 px-3 text-center">
                                            <label class="small fw-bold text-muted mb-1 d-block">置信度</label>
                                            <span id="res-conf" class="h2 fw-bold text-orange">0%</span>
                                            <div class="progress rounded-pill mt-2" style="height: 10px; background: #fff5eb;">
                                                <div id="conf-bar" class="progress-bar progress-bar-striped progress-bar-animated bg-orange-gradient" style="width: 0%"></div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                
                                <div id="default-msg" class="text-center opacity-50 py-4">
                                    <i class="fas fa-shield-dog fa-3x text-orange-light mb-2"></i>
                                    <p class="text-muted small px-4">上传照片后点击上方按钮即可获得分析结论</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <footer class="text-center py-2 opacity-50">
                <p class="smaller mb-0">项目组成员：兰棱棱、郑柯月、周洲、刘童</p>
            </footer>
        </div>
    </div>
    <script src="/static/js/main.js"></script>
</body>
</html>
